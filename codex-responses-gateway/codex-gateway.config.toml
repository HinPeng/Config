# cc-switch / Codex provider template.
# Create one new Codex provider in cc-switch using this configuration.
# The project trust entries can be copied from your existing provider if needed.

model_provider = "codex_gateway"
model = "gpt-6-astra"

# Request settings are preserved unless routes.json overrides them.

[model_providers.codex_gateway]
name = "Local Codex Model Gateway"
base_url = "http://127.0.0.1:8787"
wire_api = "responses"
requires_openai_auth = true
